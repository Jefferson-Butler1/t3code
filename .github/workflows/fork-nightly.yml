name: Fork Nightly

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if the upstream nightly and patch series are unchanged
        type: boolean
        default: false
      allow_repair:
        description: Let Claude repair the patch series if this run fails
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fork-nightly
  cancel-in-progress: false

jobs:
  nightly:
    if: github.repository == 'Jefferson-Butler1/t3code'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Check out fork maintenance
        uses: actions/checkout@v6
        with:
          ref: fork-maintenance
          path: control
          fetch-depth: 0

      - name: Test patch replay and macOS updater
        run: python3 -m unittest discover -s control/.fork -p '*_test.py'

      - name: Assemble the latest upstream nightly
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          set --
          if [[ "$FORCE" == "true" ]]; then set -- --force; fi
          python3 control/.fork/prepare.py \
            --source "$GITHUB_WORKSPACE/source" \
            --repository "$GITHUB_REPOSITORY" \
            --run-number "$GITHUB_RUN_NUMBER" \
            "$@"

      - name: Setup Vite+
        if: steps.prepare.outputs.changed == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: source/package.json
          run-install: false
          cache: false

      - name: Install desktop and verification dependencies
        if: steps.prepare.outputs.changed == 'true'
        working-directory: source
        run: vp install --frozen-lockfile --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts... --filter=./oxlint-plugin-t3code

      - name: Verify the patches against current upstream
        if: steps.prepare.outputs.changed == 'true'
        working-directory: source
        run: |
          set -euo pipefail
          (cd apps/web && vp run typecheck)
          (cd apps/desktop && vp run typecheck)
          vp lint apps/web/src/components/ChatView.tsx scripts/build-desktop-artifact.ts
          git diff --exit-code

      - name: Cache resource monitor
        if: steps.prepare.outputs.changed == 'true'
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: source/native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor
          key: fork-resource-monitor-arm64-${{ hashFiles('source/native/resource-monitor/Cargo.lock', 'source/native/resource-monitor/Cargo.toml', 'source/native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.prepare.outputs.changed == 'true' && steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Set the fork version and public configuration
        if: steps.prepare.outputs.changed == 'true'
        working-directory: source
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "$VERSION"
          cp .env.example .env

      - name: Build Apple Silicon DMG
        if: steps.prepare.outputs.changed == 'true'
        working-directory: source
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          # Unsigned macOS builds cannot use Squirrel's native updater.
          env -u GITHUB_REPOSITORY -u T3CODE_DESKTOP_UPDATE_REPOSITORY \
            vp run dist:desktop:artifact --platform mac --target dmg --arch arm64 \
            --build-version "$VERSION" --verbose
          shopt -s nullglob
          dmgs=(release/*-arm64.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "Expected exactly one Apple Silicon DMG." >&2
            exit 1
          fi
          python3 ../control/.fork/smoke.py release "$VERSION"
          cp .fork-build.json release/fork-build.json
          (cd release && shasum -a 256 -- *.dmg fork-build.json > SHA256SUMS)

      - name: Promote verified source and publish the build
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ steps.prepare.outputs.source_commit }}
          PREVIOUS_COMMIT: ${{ steps.prepare.outputs.previous_commit }}
          UPSTREAM_TAG: ${{ steps.prepare.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          git -C control push origin \
            "--force-with-lease=refs/heads/patched-nightly:$PREVIOUS_COMMIT" \
            "$SOURCE_COMMIT:refs/heads/patched-nightly"
          python3 - <<'PY'
          import os, pathlib
          pathlib.Path('release-notes.md').write_text(
              f"Personal fork of upstream `{os.environ['UPSTREAM_TAG']}` with the patch series from `fork-maintenance`.\n\n"
              "Apple Silicon macOS build. Unsigned: install manually or use the fork's macOS LaunchAgent updater; native automatic installation is disabled. "
              "See `.fork/README.md` on `fork-maintenance` for setup and removal.\n\n"
              "Typecheck, lint, and the desktop build passed. "
              "See `fork-build.json` for upstream and patch provenance and `SHA256SUMS` to verify the download.\n")
          PY
          gh release create "fork-v$VERSION" source/release/*-arm64.dmg \
            source/release/fork-build.json source/release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" \
            --prerelease --title "Patched Nightly $VERSION" --notes-file release-notes.md
          printf '### Published fork build\n\n[Download %s](https://github.com/%s/releases/tag/fork-v%s)\n' \
            "$VERSION" "$GITHUB_REPOSITORY" "$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Unchanged
        if: steps.prepare.outputs.changed == 'false'
        run: echo 'The latest upstream nightly and this patch series already have a successful release.' >> "$GITHUB_STEP_SUMMARY"

  # When the nightly fails, Claude refreshes the patch series against the failed
  # upstream tag (.fork/REPAIR.md). The agent may only read and edit files and run
  # git and vp; it holds no GitHub credentials. The workflow re-verifies its result,
  # lands it on fork-maintenance and runs the nightly once more without repair.
  repair:
    needs: nightly
    if: failure() && github.repository == 'Jefferson-Butler1/t3code' && inputs.allow_repair != false
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        shell: bash
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      CONTROL: ${{ github.workspace }}/control
      REPAIR_SUMMARY: ${{ github.workspace }}/repair-summary.md
      FAILED_RUN_LOG: ${{ github.workspace }}/failed-run.log
    steps:
      - name: Check out fork maintenance
        uses: actions/checkout@v6
        with:
          ref: fork-maintenance
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Find the failed upstream nightly
        id: failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api 'repos/pingdotgg/t3code/releases?per_page=100' --jq '
            [.[] | select(.prerelease and (.draft | not)
              and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.[0-9]{8}\\.[0-9]+$")))]
            | max_by(.published_at) | .tag_name')
          git -C control fetch --no-tags https://github.com/pingdotgg/t3code.git "refs/tags/$tag:refs/tags/$tag"
          git -C control fetch --no-tags origin patched-nightly
          previous=$(git -C control show FETCH_HEAD:.fork-build.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["upstream_commit"])')
          job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "nightly") | .id')
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" | grep -v 'Updating files:' | tail -n 600 > "$FAILED_RUN_LOG"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous_upstream_commit=$previous" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: control/package.json
          run-install: false
          cache: false

      - name: Repair the patch series with Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          UPSTREAM_TAG: ${{ steps.failed.outputs.tag }}
          PREVIOUS_UPSTREAM_COMMIT: ${{ steps.failed.outputs.previous_upstream_commit }}
        run: |
          set -euo pipefail
          if [[ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "::error::Set the CLAUDE_CODE_OAUTH_TOKEN secret (claude setup-token) to enable repairs."
            exit 1
          fi
          npm install --global @anthropic-ai/claude-code
          claude -p "Follow the instructions in $CONTROL/.fork/REPAIR.md. Paths and values: CONTROL=$CONTROL, UPSTREAM_TAG=$UPSTREAM_TAG, FAILED_RUN_LOG=$FAILED_RUN_LOG, REPAIR_SUMMARY=$REPAIR_SUMMARY, RUNNER_TEMP=$RUNNER_TEMP. The previous successful build used upstream commit $PREVIOUS_UPSTREAM_COMMIT." \
            --model claude-opus-5-5 \
            --permission-mode dontAsk \
            --allowedTools 'Read' 'Edit' 'Write' 'Glob' 'Grep' 'Bash(git *)' 'Bash(vp *)' \
            --settings '{"includeCoAuthoredBy": false}' \
            --output-format stream-json --verbose > repair-transcript.jsonl

      - name: Keep the repair transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-transcript
          path: |
            repair-transcript.jsonl
            repair-summary.md
          if-no-files-found: ignore

      - name: Re-verify the repaired series
        id: verify
        env:
          UPSTREAM_TAG: ${{ steps.failed.outputs.tag }}
        run: |
          set -euo pipefail
          cat "$REPAIR_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$(head -n 1 "$REPAIR_SUMMARY")" == "REPAIR FAILED"* ]]; then
            echo "::error::Claude could not repair the series; see the summary."
            exit 1
          fi
          changed=$(git -C control status --porcelain --untracked-files=all)
          if [[ -z "$changed" ]]; then
            echo "Nothing to repair: the series already applies." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -vE '^.. \.fork/(series|README\.md|patches/[A-Za-z0-9._-]+\.patch)$' <<<"$changed"; then
            echo "::error::The repair changed files outside the patch series."
            exit 1
          fi
          if grep -ilE 'co-authored-by:.*claude|noreply@anthropic\.com|generated with claude' control/.fork/patches/*.patch; then
            echo "::error::A patch carries AI attribution."
            exit 1
          fi
          git -C control worktree add --detach "$RUNNER_TEMP/verify" "$UPSTREAM_TAG"
          cd "$RUNNER_TEMP/verify"
          while read -r name; do
            [[ -z "$name" || "$name" == \#* ]] && continue
            git -c core.hooksPath=/dev/null am "$CONTROL/.fork/patches/$name"
          done < "$CONTROL/.fork/series"
          vp install --frozen-lockfile
          vp -C apps/web run typecheck
          vp -C apps/desktop run typecheck
          vp -C apps/mobile run typecheck
          vp -C apps/desktop run build
          vp lint apps/web/src/components/ChatView.tsx scripts/build-desktop-artifact.ts
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Land the repair and rebuild
        if: steps.verify.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C control add .fork
          git -C control -c core.hooksPath=/dev/null commit -F "$REPAIR_SUMMARY"
          # Fast-forward only: a concurrent edit to fork-maintenance wins over the repair.
          git -C control push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/fork-maintenance
          gh workflow run fork-nightly.yml --repo "$GITHUB_REPOSITORY" --ref fork-maintenance -f allow_repair=false
